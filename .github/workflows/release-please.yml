name: release-please

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check-workflows:
    name: Check if all workflows passed
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = context.payload.workflow_run.head_sha;
            
            // Check CI workflow status
            const ciRun = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: commitSha,
              per_page: 1
            });
            
            const ciStatus = ciRun.data.workflow_runs[0]?.conclusion;
            
            if (ciStatus !== 'success') {
              core.setFailed(`CI workflow did not pass. Status: ${ciStatus || 'not found'}`);
            }
            
            core.info(`CI workflow passed! Status: ${ciStatus}`);

  release-please:
    name: Release Please
    needs: check-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Upload Release Assets
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            bin/kxconfig
            bin/kxswap
            scripts/install.sh
            scripts/uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

